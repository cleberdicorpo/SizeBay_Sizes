<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Teste Sizebay Iframe</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.75);
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      z-index: 2;
    }

    #modal-wrapper {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #szb-modal {
      width: 1127px;
      height: 915px;
      max-width: 95vw;
      max-height: 95vh;
      border: 0;
      background: #fff;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      color: #111;
      padding: 32px;
      box-sizing: border-box;
      z-index: 3;
    }

    #error pre {
      background: #111;
      color: #0f0;
      padding: 16px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 70vh;
    }
  </style>
</head>

<body>
  <div id="loading">
    Carregando iframe Sizebay...
  </div>

  <div id="modal-wrapper">
    <iframe
      id="szb-modal"
      class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
      sizebay-product-reference="82262568"
      allow="clipboard-write; fullscreen">
    </iframe>
  </div>

  <div id="error">
    <h1>Erro ao carregar Sizebay</h1>
    <pre id="error-detail"></pre>
  </div>

  <script>
    const TENANT_ID = "7943";
    const PRODUCT_ID = "82262568";
    const LANG = "pt";

    const BACKDROP_WIDTH = "1127";
    const BACKDROP_HEIGHT = "915";

    const loading = document.getElementById("loading");
    const wrapper = document.getElementById("modal-wrapper");
    const iframe = document.getElementById("szb-modal");
    const errorBox = document.getElementById("error");
    const errorDetail = document.getElementById("error-detail");

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
    }

    function setCookie(name, value) {
      document.cookie = `${name}=${value}; path=/; max-age=31536000; SameSite=Lax`;
    }

    async function getSizebaySessionId() {
      const cookieName = "SIZEBAY_SESSION_ID_V4";
      const sidFromCookie = getCookie(cookieName);

      if (sidFromCookie) {
        return sidFromCookie;
      }

      const response = await fetch(
        "https://vfr-v3-production.sizebay.technology/api/me/session-id"
      );

      if (!response.ok) {
        throw new Error(`Erro ao gerar SID. HTTP ${response.status}`);
      }

      const sid = (await response.text()).replaceAll('"', "").trim();

      if (!sid) {
        throw new Error("A Sizebay retornou SID vazio.");
      }

      setCookie(cookieName, sid);

      return sid;
    }

    function buildIframeUrl(sid) {
      const url = new URL("https://vfr-v3-production.sizebay.technology/V4/");

      url.searchParams.set("mode", "vfr");
      url.searchParams.set("id", PRODUCT_ID);
      url.searchParams.set("sid", sid);
      url.searchParams.set("lang", LANG);
      url.searchParams.set("tenantId", TENANT_ID);
      url.searchParams.set("backdropWidth", BACKDROP_WIDTH);
      url.searchParams.set("backdropHeight", BACKDROP_HEIGHT);
      url.searchParams.set("isMeasurementsTableEnabled", "true");

      return url.toString();
    }

    function showError(error) {
      console.error(error);

      loading.style.display = "none";
      wrapper.style.display = "none";
      errorBox.style.display = "block";
      errorDetail.textContent = error.stack || error.message || String(error);
    }

    async function start() {
      try {
        const sid = await getSizebaySessionId();
        const iframeUrl = buildIframeUrl(sid);

        console.log("Iframe Sizebay:", iframeUrl);

        iframe.src = iframeUrl;

        wrapper.style.display = "flex";
        loading.style.display = "none";

      } catch (error) {
        showError(error);
      }
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
