<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SizeBay Medidas</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .box {
      max-width: 420px;
      padding: 32px;
    }

    .box h1 {
      margin-bottom: 12px;
      font-size: 24px;
    }

    .box p {
      margin-bottom: 24px;
      color: #ccc;
    }

    .box button {
      padding: 14px 22px;
      border: 0;
      background: #ffffff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>SizeBay Medidas</h1>
    <p>Carregando o provador virtual...</p>
    <button onclick="abrirSizeBay()">Abrir SizeBay</button>
  </div>

  <script>
    const SIZEBAY_URL =
      "https://vfr-v3-production.sizebay.technology/V4/" +
      "?mode=vfr" +
      "&id=82262568" +
      "&sid=" +
      "&lang=pt" +
      "&tenantId=7943" +
      "&backdropWidth=1127" +
      "&backdropHeight=915" +
      "&isMeasurementsTableEnabled=true";

    function abrirSizeBay() {
      window.location.href = SIZEBAY_URL;
    }

    window.addEventListener("load", function () {
      setTimeout(abrirSizeBay, 500);
    });
  </script>
</body>
</html>
