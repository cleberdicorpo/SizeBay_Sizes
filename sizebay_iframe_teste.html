<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SizeBay Medidas</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-size: 18px;
      z-index: 10;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #111;
      overflow: hidden;
      display: none;
    }

    /*
      Este wrapper mantém o tamanho real usado pela Sizebay.
      NÃO usar width: 100vw nem height: 100vh no iframe.
    */
    #scale-wrapper {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1127px;
      height: 915px;
      transform-origin: center center;
      background: transparent;
    }

    #szb-modal {
      width: 1127px;
      height: 915px;
      border: 0;
      display: block;
      background: transparent;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      padding: 32px;
      box-sizing: border-box;
      background: #fff;
      color: #111;
      z-index: 20;
    }

    #error pre {
      background: #111;
      color: #0f0;
      padding: 16px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 70vh;
    }
  </style>
</head>

<body>
  <div id="loading">
    Carregando SizeBay Medidas...
  </div>

  <div id="stage">
    <div id="scale-wrapper">
      <iframe
        id="szb-modal"
        class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
        sizebay-product-reference="82262568"
        allow="clipboard-write; fullscreen">
      </iframe>
    </div>
  </div>

  <div id="error">
    <h1>Erro ao carregar SizeBay</h1>
    <pre id="error-detail"></pre>
  </div>

  <script>
    const TENANT_ID = "7943";
    const PRODUCT_ID = "82262568";
    const LANG = "pt";

    const IFRAME_WIDTH = 1127;
    const IFRAME_HEIGHT = 915;

    const loading = document.getElementById("loading");
    const stage = document.getElementById("stage");
    const wrapper = document.getElementById("scale-wrapper");
    const iframe = document.getElementById("szb-modal");
    const errorBox = document.getElementById("error");
    const errorDetail = document.getElementById("error-detail");

    function resizeIframeWrapper() {
      const margin = 24;

      const availableWidth = window.innerWidth - margin;
      const availableHeight = window.innerHeight - margin;

      const scaleX = availableWidth / IFRAME_WIDTH;
      const scaleY = availableHeight / IFRAME_HEIGHT;

      const scale = Math.min(scaleX, scaleY, 1);

      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
    }

    function setCookie(name, value) {
      document.cookie = `${name}=${value}; path=/; max-age=31536000; SameSite=Lax`;
    }

    async function getSizebaySessionId() {
      const cookieName = "SIZEBAY_SESSION_ID_V4";
      const sidFromCookie = getCookie(cookieName);

      if (sidFromCookie) {
        return sidFromCookie;
      }

      const response = await fetch(
        "https://vfr-v3-production.sizebay.technology/api/me/session-id"
      );

      if (!response.ok) {
        throw new Error(`Erro ao gerar SID. HTTP ${response.status}`);
      }

      const sid = (await response.text()).replaceAll('"', "").trim();

      if (!sid) {
        throw new Error("A Sizebay retornou SID vazio.");
      }

      setCookie(cookieName, sid);

      return sid;
    }

    function buildIframeUrl(sid) {
      const url = new URL("https://vfr-v3-production.sizebay.technology/V4/");

      url.searchParams.set("mode", "vfr");
      url.searchParams.set("id", PRODUCT_ID);
      url.searchParams.set("sid", sid);
      url.searchParams.set("lang", LANG);
      url.searchParams.set("tenantId", TENANT_ID);

      /*
        Estes valores precisam bater com o tamanho real do iframe.
      */
      url.searchParams.set("backdropWidth", String(IFRAME_WIDTH));
      url.searchParams.set("backdropHeight", String(IFRAME_HEIGHT));

      url.searchParams.set("isMeasurementsTableEnabled", "true");

      /*
        Mantive para tentar esconder os botões internos de fechar.
        Se a Sizebay não respeitar, o botão volta, mas o layout fica correto.
      */
      url.searchParams.set("disableCloseApp", "true");

      return url.toString();
    }

    function showError(error) {
      console.error(error);

      loading.style.display = "none";
      stage.style.display = "none";
      errorBox.style.display = "block";
      errorDetail.textContent = error.stack || error.message || String(error);
    }

    async function start() {
      try {
        resizeIframeWrapper();

        const sid = await getSizebaySessionId();
        const iframeUrl = buildIframeUrl(sid);

        console.log("URL SizeBay:", iframeUrl);

        iframe.onload = function () {
          resizeIframeWrapper();
          loading.style.display = "none";
          stage.style.display = "block";
        };

        iframe.src = iframeUrl;

      } catch (error) {
        showError(error);
      }
    }

    window.addEventListener("load", start);
    window.addEventListener("resize", resizeIframeWrapper);
  </script>
</body>
</html>
