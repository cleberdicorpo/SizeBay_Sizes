<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Teste Sizebay Iframe Final</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      z-index: 10;
      background: #111;
    }

    #page {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: hidden;
    }

    /*
      Wrapper só para centralizar e escalar proporcionalmente.
      Não recorta o iframe e não altera o cálculo interno da Sizebay.
    */
    #scale-wrapper {
      width: 1127px;
      height: 915px;
      transform-origin: center center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      background: transparent;
    }

    #szb-modal {
      width: 1127px;
      height: 915px;
      border: 0;
      display: block;
      background: transparent;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      padding: 32px;
      box-sizing: border-box;
      background: #fff;
      color: #111;
      z-index: 20;
    }

    #error pre {
      background: #111;
      color: #0f0;
      padding: 16px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 70vh;
    }
  </style>
</head>

<body>
  <div id="loading">Carregando Sizebay...</div>

  <div id="page">
    <div id="scale-wrapper">
      <iframe
        id="szb-modal"
        class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
        sizebay-product-reference="82262568"
        allow="clipboard-write; fullscreen">
      </iframe>
    </div>
  </div>

  <div id="error">
    <h1>Erro ao carregar Sizebay</h1>
    <pre id="error-detail"></pre>
  </div>

  <script>
    const TENANT_ID = "7943";
    const PRODUCT_ID = "82262568";
    const LANG = "pt";

    const IFRAME_WIDTH = 1127;
    const IFRAME_HEIGHT = 915;

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const wrapper = document.getElementById("scale-wrapper");
    const iframe = document.getElementById("szb-modal");
    const errorBox = document.getElementById("error");
    const errorDetail = document.getElementById("error-detail");

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
    }

    function setCookie(name, value) {
      document.cookie = `${name}=${value}; path=/; max-age=31536000; SameSite=Lax`;
    }

    function resizeWrapper() {
      const margin = 24;

      const scaleX = (window.innerWidth - margin) / IFRAME_WIDTH;
      const scaleY = (window.innerHeight - margin) / IFRAME_HEIGHT;

      const scale = Math.min(scaleX, scaleY, 1);

      wrapper.style.transform = `scale(${scale})`;
    }

    async function getSizebaySessionId() {
      const cookieName = "SIZEBAY_SESSION_ID_V4";
      const sidFromCookie = getCookie(cookieName);

      if (sidFromCookie) {
        return sidFromCookie;
      }

      const response = await fetch(
        "https://vfr-v3-production.sizebay.technology/api/me/session-id"
      );

      if (!response.ok) {
        throw new Error(`Erro ao gerar SID. HTTP ${response.status}`);
      }

      const sid = (await response.text()).replaceAll('"', "").trim();

      if (!sid) {
        throw new Error("A Sizebay retornou SID vazio.");
      }

      setCookie(cookieName, sid);

      return sid;
    }

    function buildIframeUrl(sid) {
      const url = new URL("https://vfr-v3-production.sizebay.technology/V4/");

      url.searchParams.set("mode", "vfr");
      url.searchParams.set("id", PRODUCT_ID);
      url.searchParams.set("sid", sid);
      url.searchParams.set("lang", LANG);
      url.searchParams.set("tenantId", TENANT_ID);

      /*
        Manter fixo conforme iframe enviado pelo fornecedor.
        Não trocar por window.innerWidth/window.innerHeight.
      */
      url.searchParams.set("backdropWidth", String(IFRAME_WIDTH));
      url.searchParams.set("backdropHeight", String(IFRAME_HEIGHT));

      url.searchParams.set("isMeasurementsTableEnabled", "true");

      /*
        Tentativa correta para remover os botões internos de fechamento.
        Se a Sizebay respeitar esse parâmetro, some o X e o botão Fechar.
        Se não respeitar, só o fornecedor consegue remover na configuração.
      */
      url.searchParams.set("disableCloseApp", "true");

      return url.toString();
    }

    function showError(error) {
      console.error(error);

      loading.style.display = "none";
      page.style.display = "none";
      errorBox.style.display = "block";
      errorDetail.textContent = error.stack || error.message || String(error);
    }

    async function start() {
      try {
        resizeWrapper();

        const sid = await getSizebaySessionId();
        const iframeUrl = buildIframeUrl(sid);

        console.log("URL Sizebay:", iframeUrl);

        iframe.onload = function () {
          loading.style.display = "none";
          page.style.display = "flex";
          resizeWrapper();
        };

        iframe.src = iframeUrl;

      } catch (error) {
        showError(error);
      }
    }

    window.addEventListener("load", start);
    window.addEventListener("resize", resizeWrapper);
  </script>
</body>
</html>
