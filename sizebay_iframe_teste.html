<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sizebay Iframe Fullscreen</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-size: 18px;
      z-index: 2;
    }

    #szb-modal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: none;
      background: transparent;
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      padding: 32px;
      box-sizing: border-box;
      background: #fff;
      color: #111;
      z-index: 3;
    }

    #error pre {
      background: #111;
      color: #0f0;
      padding: 16px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 70vh;
    }
  </style>
</head>

<body>
  <div id="loading">Carregando Sizebay...</div>

  <iframe
    id="szb-modal"
    class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
    sizebay-product-reference="82262568"
    allow="clipboard-write; fullscreen">
  </iframe>

  <div id="error">
    <h1>Erro ao carregar Sizebay</h1>
    <pre id="error-detail"></pre>
  </div>

  <script>
    const TENANT_ID = "7943";
    const PRODUCT_ID = "82262568";
    const LANG = "pt";
    const COUNTRY = "BR";

    const loading = document.getElementById("loading");
    const iframe = document.getElementById("szb-modal");
    const errorBox = document.getElementById("error");
    const errorDetail = document.getElementById("error-detail");

    function getDevice() {
      const ua = navigator.userAgent;

      if (/Android|webOS|iPhone|iPod|BlackBerry|Windows Phone/i.test(ua)) {
        return "MOBILE";
      }

      if (/iPad|Tablet/i.test(ua)) {
        return "TABLET";
      }

      return "DESKTOP";
    }

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
    }

    function setCookie(name, value) {
      document.cookie = `${name}=${value}; path=/; max-age=31536000; SameSite=Lax`;
    }

    async function getSizebaySessionId() {
      const cookieName = "SIZEBAY_SESSION_ID_V4";
      const existingSid = getCookie(cookieName);

      if (existingSid) {
        return existingSid;
      }

      const response = await fetch(
        "https://vfr-v3-production.sizebay.technology/api/me/session-id"
      );

      if (!response.ok) {
        throw new Error(`Erro ao gerar SID Sizebay. HTTP ${response.status}`);
      }

      const sid = (await response.text()).replaceAll('"', "").trim();

      if (!sid) {
        throw new Error("A Sizebay retornou SID vazio.");
      }

      setCookie(cookieName, sid);

      return sid;
    }

    function buildIframeUrl(sid) {
      const url = new URL("https://vfr-v3-production.sizebay.technology/V4/");

      url.searchParams.set("mode", "vfr");
      url.searchParams.set("id", PRODUCT_ID);
      url.searchParams.set("sid", sid);
      url.searchParams.set("tenantId", TENANT_ID);
      url.searchParams.set("lang", LANG);
      url.searchParams.set("device", getDevice());
      url.searchParams.set("countryValue", COUNTRY);
      url.searchParams.set("watchOpeningEvents", "true");
      url.searchParams.set("isMeasurementsTableEnabled", "true");

      /*
        Este é o ajuste principal:
        desativa os botões/triggers internos de fechamento da Sizebay.
      */
      url.searchParams.set("disableCloseApp", "true");

      /*
        Mantém o cálculo interno coerente com o tamanho real da tela.
        Não usa crop, não usa máscara, não desloca o modal.
      */
      url.searchParams.set("backdropWidth", String(window.innerWidth));
      url.searchParams.set("backdropHeight", String(window.innerHeight));

      return url.toString();
    }

    function showError(error) {
      console.error(error);

      loading.style.display = "none";
      iframe.style.display = "none";
      errorBox.style.display = "block";
      errorDetail.textContent = error.stack || error.message || String(error);
    }

    async function start() {
      try {
        const sid = await getSizebaySessionId();
        const iframeUrl = buildIframeUrl(sid);

        console.log("URL Sizebay:", iframeUrl);

        iframe.onload = function () {
          loading.style.display = "none";
          iframe.style.display = "block";
        };

        iframe.src = iframeUrl;

      } catch (error) {
        showError(error);
      }
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
