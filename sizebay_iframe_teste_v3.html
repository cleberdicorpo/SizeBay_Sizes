<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Teste Sizebay Iframe Ajustado</title>

  <style>
    :root {
      /*
        Tamanho informado para a Sizebay montar o layout interno.

        Aumentamos a largura para tentar fazer a Sizebay
        separar melhor:
        - imagem da roupa à esquerda
        - formulário/conteúdo à direita
      */
      --iframe-width: 1400px;
      --iframe-height: 915px;

      /*
        Área realmente visível na página.
      */
      --crop-width: 909px;
      --crop-height: 506px;

      /*
        Deslocamento do iframe dentro da janela de recorte.

        Como o iframe agora possui 1400px e mostramos apenas 909px,
        movemos o iframe para a esquerda para enquadrar a região central.

        Diferença:
        1400 - 909 = 491px
        491 / 2 = 245,5px
      */
      --shift-x: -245px;

      /*
        Ajuste vertical.
        Pode ser refinado depois se necessário.
      */
      --shift-y: 0px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    /*
      Loading inicial.
    */
    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
      font-size: 18px;

      background: #111;

      z-index: 10;
    }

    /*
      Área que centraliza o conteúdo Sizebay.
    */
    #modal-area {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: #111;
      overflow: hidden;
    }

    /*
      Janela visível.

      O iframe é maior que esta área.
      Tudo que passar será cortado.
    */
    #iframe-crop {
      position: relative;

      width: var(--crop-width);
      height: var(--crop-height);

      overflow: hidden;

      background: #fff;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);

      border-top: 5px solid #eee;
    }

    /*
      Iframe Sizebay.

      Mantemos ele maior que a janela externa
      para que a Sizebay monte o layout desktop
      considerando uma largura maior.
    */
    #szb-modal {
      position: absolute;

      left: var(--shift-x);
      top: var(--shift-y);

      width: var(--iframe-width);
      height: var(--iframe-height);

      border: 0;

      background: #fff;

      display: block;
    }

    /*
      Máscara opcional para cobrir algum botão interno
      de fechamento da Sizebay.

      Caso não esteja cobrindo nada necessário,
      pode deixar como está ou remover depois.
    */
    #hide-bottom-close {
      position: absolute;

      right: 0;
      bottom: 0;

      width: 150px;
      height: 65px;

      background: #fff;

      z-index: 5;

      pointer-events: auto;
    }

    /*
      Tela de erro.
    */
    #error {
      display: none;

      position: fixed;
      inset: 0;

      background: #fff;
      color: #111;

      padding: 32px;

      box-sizing: border-box;

      z-index: 20;
    }

    #error h1 {
      margin-top: 0;
    }

    #error pre {
      background: #111;
      color: #0f0;

      padding: 16px;

      white-space: pre-wrap;
      overflow: auto;

      max-height: 70vh;
    }
  </style>
</head>

<body>

  <div id="loading">
    Carregando iframe Sizebay...
  </div>

  <div id="modal-area">

    <div id="iframe-crop">

      <iframe
        id="szb-modal"
        class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
        sizebay-product-reference="118678521"
        allow="clipboard-write; fullscreen">
      </iframe>

      <div id="hide-bottom-close"></div>

    </div>

  </div>

  <div id="error">
    <h1>Erro ao carregar Sizebay</h1>
    <pre id="error-detail"></pre>
  </div>

  <script>
    /*
      Configurações Sizebay
    */
    const TENANT_ID = "8361";
    const PRODUCT_ID = "118678521";
    const LANG = "pt";

    /*
      IMPORTANTE:

      Este valor precisa acompanhar a largura CSS
      definida em:

      --iframe-width: 1400px

      Isso faz a Sizebay acreditar que possui
      uma área maior disponível.
    */
    const BACKDROP_WIDTH = "1400";

    const BACKDROP_HEIGHT = "915";

    /*
      Elementos
    */
    const loading =
      document.getElementById("loading");

    const modalArea =
      document.getElementById("modal-area");

    const iframe =
      document.getElementById("szb-modal");

    const errorBox =
      document.getElementById("error");

    const errorDetail =
      document.getElementById("error-detail");


    /*
      Busca cookie local.
    */
    function getCookie(name) {
      const cookie = document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="));

      if (!cookie) {
        return null;
      }

      return cookie.split("=")[1];
    }


    /*
      Salva cookie local.
    */
    function setCookie(name, value) {
      document.cookie =
        `${name}=${value}; ` +
        `path=/; ` +
        `max-age=31536000; ` +
        `SameSite=Lax`;
    }


    /*
      Obtém o SID da Sizebay.
    */
    async function getSizebaySessionId() {

      const cookieName =
        "SIZEBAY_SESSION_ID_V4";

      const sidFromCookie =
        getCookie(cookieName);

      /*
        Se já existe uma sessão,
        reutilizamos.
      */
      if (sidFromCookie) {
        console.log(
          "SID Sizebay recuperado do cookie:",
          sidFromCookie
        );

        return sidFromCookie;
      }

      /*
        Caso contrário,
        gera uma nova sessão.
      */
      const response = await fetch(
        "https://vfr-v3-production.sizebay.technology/api/me/session-id"
      );

      if (!response.ok) {
        throw new Error(
          `Erro ao gerar SID. HTTP ${response.status}`
        );
      }

      const responseText =
        await response.text();

      const sid =
        responseText
          .replaceAll('"', "")
          .trim();

      if (!sid) {
        throw new Error(
          "A Sizebay retornou SID vazio."
        );
      }

      /*
        Guarda a sessão para reutilização.
      */
      setCookie(
        cookieName,
        sid
      );

      console.log(
        "Novo SID Sizebay:",
        sid
      );

      return sid;
    }


    /*
      Monta a URL final do iframe.
    */
    function buildIframeUrl(sid) {

      const url = new URL(
        "https://vfr-v3-production.sizebay.technology/V4/"
      );

      url.searchParams.set(
        "mode",
        "vfr"
      );

      url.searchParams.set(
        "id",
        PRODUCT_ID
      );

      url.searchParams.set(
        "sid",
        sid
      );

      url.searchParams.set(
        "lang",
        LANG
      );

      url.searchParams.set(
        "tenantId",
        TENANT_ID
      );

      /*
        Esses parâmetros são os mais importantes
        para o layout que estamos tentando obter.
      */
      url.searchParams.set(
        "backdropWidth",
        BACKDROP_WIDTH
      );

      url.searchParams.set(
        "backdropHeight",
        BACKDROP_HEIGHT
      );

      url.searchParams.set(
        "isMeasurementsTableEnabled",
        "true"
      );

      return url.toString();
    }


    /*
      Exibe tela de erro.
    */
    function showError(error) {

      console.error(
        "Erro Sizebay:",
        error
      );

      loading.style.display =
        "none";

      modalArea.style.display =
        "none";

      errorBox.style.display =
        "block";

      errorDetail.textContent =
        error.stack ||
        error.message ||
        String(error);
    }


    /*
      Inicialização.
    */
    async function start() {

      try {

        /*
          1. Obtém sessão Sizebay
        */
        const sid =
          await getSizebaySessionId();

        /*
          2. Monta URL
        */
        const iframeUrl =
          buildIframeUrl(sid);

        console.log(
          "URL iframe Sizebay:",
          iframeUrl
        );

        /*
          3. Configura callback
          ANTES de definir o src.
        */
        iframe.onload = function () {

          console.log(
            "Iframe Sizebay carregado."
          );

          loading.style.display =
            "none";

          modalArea.style.display =
            "flex";
        };

        /*
          4. Carrega Sizebay
        */
        iframe.src =
          iframeUrl;

      } catch (error) {

        showError(error);

      }
    }


    /*
      Inicializa quando a página carregar.
    */
    window.addEventListener(
      "load",
      start
    );
  </script>

</body>
</html>
