<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sizebay VFR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #fff;

      font-size: 18px;

      z-index: 100;
    }

    #modal-area {
      display: none;

      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 100vh;

      padding: 20px;

      background: #111;
    }

    /*
      Desktop:
      A Sizebay exige largura interna >= 946px (innerWidth + 18 >= 946)
      para carregar a interface Desktop.
      Abaixo de 946px (entre 768px e 945px), a Sizebay classifica
      como TABLET e exige rotação de tela ("Coloque seu dispositivo na horizontal").
      Por isso, o container precisa de pelo menos 960px de largura no Desktop.
    */
    #vfr-container {
      position: relative;

      width: 960px;
      height: 560px;

      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    #szb-modal {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #fff;
    }

    #error {
      display: none;

      position: fixed;
      inset: 0;

      padding: 32px;

      background: #fff;
      color: #111;

      z-index: 200;
    }

    #error pre {
      background: #111;
      color: #0f0;

      padding: 16px;

      white-space: pre-wrap;

      overflow: auto;

      max-height: 70vh;
    }

    /*
      Abaixo de 960px usamos a tela inteira (modo mobile da Sizebay).
      Isso evita cair na faixa de tablet (768px - 945px) que bloqueia a interface.
    */
    @media (max-width: 959px) {
      body {
        display: block;
      }

      #modal-area {
        width: 100vw;
        height: 100vh;

        min-height: 100vh;

        padding: 0;
      }

      #vfr-container {
        width: 100vw;
        height: 100vh;

        max-width: none;
        max-height: none;

        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    Carregando Sizebay...
  </div>

  <div id="modal-area">

    <div id="vfr-container">

      <iframe
        id="szb-modal"
        title="Provador Virtual Sizebay"
        allow="clipboard-write; fullscreen"
      ></iframe>

    </div>

  </div>

  <div id="error">

    <h1>
      Erro ao carregar Sizebay
    </h1>

    <pre id="error-detail"></pre>

  </div>

  <script>
    /*
     * =====================================================
     * CONFIGURAÇÃO
     * =====================================================
     */

    const TENANT_ID =
      "8361";

    const PRODUCT_ID =
      "118678521";

    const LANG =
      "br";


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const loading =
      document.getElementById("loading");

    const modalArea =
      document.getElementById("modal-area");

    const iframe =
      document.getElementById("szb-modal");

    const errorBox =
      document.getElementById("error");

    const errorDetail =
      document.getElementById("error-detail");


    /*
     * =====================================================
     * DETECÇÃO DO DEVICE
     * =====================================================
     *
     * DESKTOP
     * MOBILE
     * TABLET
     *
     * Esses são valores documentados pela Sizebay.
     */

    function getSizebayDevice() {

      const width =
        window.innerWidth;

      const userAgent =
        navigator.userAgent || "";

      const isTablet =
        /iPad|Tablet|PlayBook|Silk/i.test(
          userAgent
        ) ||
        (
          /Android/i.test(userAgent) &&
          width >= 768
        );

      const isMobile =
        /Android|iPhone|iPod|Mobile/i.test(
          userAgent
        );


      if (isTablet && width >= 960) {
        return "TABLET";
      }

      if (isMobile || width < 960) {
        return "MOBILE";
      }


      return "DESKTOP";
    }


    /*
     * =====================================================
     * COOKIE
     * =====================================================
     */

    function getCookie(name) {

      const cookies =
        document.cookie.split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );


      if (!cookie) {
        return null;
      }


      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value
    ) {

      document.cookie =
        `${name}=${encodeURIComponent(value)}; ` +
        `path=/; ` +
        `max-age=31536000; ` +
        `SameSite=Lax`;
    }


    /*
     * =====================================================
     * SESSION ID
     * =====================================================
     */

    async function getSizebaySessionId() {

      const cookieName =
        "SIZEBAY_SESSION_ID_V4";


      const existingSid =
        getCookie(
          cookieName
        );


      if (existingSid) {

        console.log(
          "SID recuperado:",
          existingSid
        );

        return existingSid;
      }


      const response =
        await fetch(
          "https://vfr-v3-production.sizebay.technology/api/me/session-id"
        );


      if (!response.ok) {

        throw new Error(
          `Erro ao gerar SID. HTTP ${response.status}`
        );
      }


      const raw =
        await response.text();


      const sid =
        raw
          .replaceAll('"', "")
          .trim();


      if (!sid) {

        throw new Error(
          "A Sizebay retornou SID vazio."
        );
      }


      setCookie(
        cookieName,
        sid
      );


      return sid;
    }


    /*
     * =====================================================
     * URL
     * =====================================================
     */

    function buildIframeUrl(
      sid,
      device
    ) {

      const url =
        new URL(
          "https://vfr-v3-production.sizebay.technology/V4/"
        );


      url.searchParams.set(
        "mode",
        "vfr"
      );


      url.searchParams.set(
        "id",
        PRODUCT_ID
      );


      url.searchParams.set(
        "sid",
        sid
      );


      url.searchParams.set(
        "tenantId",
        TENANT_ID
      );


      url.searchParams.set(
        "lang",
        LANG
      );


      /*
       * Parâmetro obrigatório/documentado
       * pela Sizebay.
       */
      url.searchParams.set(
        "device",
        device
      );


      /*
       * Também documentado como obrigatório
       * para implantação via API.
       */
      url.searchParams.set(
        "watchOpeningEvents",
        "true"
      );


      return url.toString();
    }


    /*
     * =====================================================
     * ERRO
     * =====================================================
     */

    function showError(error) {

      console.error(
        "Erro Sizebay:",
        error
      );


      loading.style.display =
        "none";


      modalArea.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorDetail.textContent =
        error.stack ||
        error.message ||
        String(error);
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    async function start() {

      try {

        const device =
          getSizebayDevice();


        console.log(
          "=============================="
        );

        console.log(
          "SIZEBAY DEVICE:",
          device
        );

        console.log(
          "Viewport:",
          window.innerWidth,
          "x",
          window.innerHeight
        );

        console.log(
          "orientation:",
          window.matchMedia(
            "(orientation: landscape)"
          ).matches
            ? "landscape"
            : "portrait"
        );

        console.log(
          "User Agent:",
          navigator.userAgent
        );

        console.log(
          "=============================="
        );


        const sid =
          await getSizebaySessionId();


        const iframeUrl =
          buildIframeUrl(
            sid,
            device
          );


        console.log(
          "URL Sizebay:",
          iframeUrl
        );


        iframe.onload =
          function () {

            console.log(
              "Sizebay carregada."
            );


            console.log(
              "Iframe:",
              iframe.getBoundingClientRect().width,
              "x",
              iframe.getBoundingClientRect().height
            );


            loading.style.display =
              "none";


            modalArea.style.display =
              "flex";
          };


        iframe.src =
          iframeUrl;

      }
      catch (error) {

        showError(
          error
        );
      }
    }


    window.addEventListener(
      "load",
      start
    );

  </script>

</body>
</html>
