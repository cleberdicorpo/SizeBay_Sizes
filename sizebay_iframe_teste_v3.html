<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sizebay VFR Teste</title>

  <style>
    :root {
      /*
       * Este agora é o TAMANHO REAL do iframe.
       *
       * Não existe mais iframe maior sendo recortado.
       */
      --vfr-width: 909px;
      --vfr-height: 500px;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    /*
     * =====================================================
     * LOADING
     * =====================================================
     */
    #loading {
      position: fixed;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      color: #fff;

      font-size: 18px;

      z-index: 100;
    }

    /*
     * =====================================================
     * ÁREA EXTERNA
     * =====================================================
     */
    #modal-area {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: #111;

      overflow: hidden;
    }

    /*
     * =====================================================
     * CONTAINER
     * =====================================================
     *
     * Agora o container tem exatamente o mesmo tamanho
     * do iframe.
     *
     * Não existe mais crop.
     */
    #vfr-container {
      position: relative;

      width: var(--vfr-width);
      height: var(--vfr-height);

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    /*
     * =====================================================
     * IFRAME
     * =====================================================
     *
     * Esta é a alteração principal.
     *
     * A Sizebay agora recebe um viewport REAL
     * de aproximadamente 909 × 500.
     */
    #szb-modal {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #fff;
    }

    /*
     * =====================================================
     * ERRO
     * =====================================================
     */
    #error {
      display: none;

      position: fixed;

      inset: 0;

      box-sizing: border-box;

      padding: 32px;

      background: #fff;

      color: #111;

      z-index: 200;
    }

    #error h1 {
      margin-top: 0;
    }

    #error pre {
      padding: 16px;

      background: #111;
      color: #0f0;

      white-space: pre-wrap;

      overflow: auto;

      max-height: 70vh;
    }
  </style>
</head>

<body>

  <!-- ===================================================
       LOADING
       =================================================== -->
  <div id="loading">
    Carregando Sizebay...
  </div>


  <!-- ===================================================
       VFR
       =================================================== -->
  <div id="modal-area">

    <div id="vfr-container">

      <iframe
        id="szb-modal"
        title="Provador Virtual Sizebay"
        allow="clipboard-write; fullscreen"
      ></iframe>

    </div>

  </div>


  <!-- ===================================================
       ERRO
       =================================================== -->
  <div id="error">

    <h1>
      Erro ao carregar Sizebay
    </h1>

    <pre id="error-detail"></pre>

  </div>


  <script>

    /*
     * =====================================================
     * CONFIGURAÇÃO
     * =====================================================
     */

    const TENANT_ID =
      "8361";

    const PRODUCT_ID =
      "118678521";

    /*
     * A documentação Sizebay usa "br"
     * para português brasileiro.
     */
    const LANG =
      "br";

    /*
     * Estamos explicitamente dizendo que
     * a integração é Desktop.
     */
    const DEVICE =
      "DESKTOP";


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const loading =
      document.getElementById(
        "loading"
      );

    const modalArea =
      document.getElementById(
        "modal-area"
      );

    const iframe =
      document.getElementById(
        "szb-modal"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const errorDetail =
      document.getElementById(
        "error-detail"
      );


    /*
     * =====================================================
     * COOKIE
     * =====================================================
     */

    function getCookie(name) {

      const cookies =
        document.cookie.split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );

      if (!cookie) {
        return null;
      }

      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value
    ) {

      document.cookie =
        `${name}=${encodeURIComponent(value)}; ` +
        `path=/; ` +
        `max-age=31536000; ` +
        `SameSite=Lax`;
    }


    /*
     * =====================================================
     * SESSION ID
     * =====================================================
     */

    async function getSizebaySessionId() {

      const cookieName =
        "SIZEBAY_SESSION_ID_V4";


      /*
       * Primeiro tenta reutilizar o SID
       * que já existe.
       */
      const existingSid =
        getCookie(
          cookieName
        );


      if (existingSid) {

        console.log(
          "SID Sizebay recuperado:",
          existingSid
        );

        return existingSid;
      }


      /*
       * Caso não exista SID,
       * solicita um novo.
       */
      const response =
        await fetch(
          "https://vfr-v3-production.sizebay.technology/api/me/session-id"
        );


      if (!response.ok) {

        throw new Error(
          `Erro ao gerar SID. HTTP ${response.status}`
        );
      }


      const raw =
        await response.text();


      const sid =
        raw
          .replaceAll('"', "")
          .trim();


      if (!sid) {

        throw new Error(
          "A Sizebay retornou SID vazio."
        );
      }


      /*
       * Salva SID.
       */
      setCookie(
        cookieName,
        sid
      );


      console.log(
        "Novo SID Sizebay:",
        sid
      );


      return sid;
    }


    /*
     * =====================================================
     * URL SIZEBAY
     * =====================================================
     */

    function buildIframeUrl(
      sid
    ) {

      const url =
        new URL(
          "https://vfr-v3-production.sizebay.technology/V4/"
        );


      /*
       * Tipo de experiência.
       */
      url.searchParams.set(
        "mode",
        "vfr"
      );


      /*
       * Produto.
       */
      url.searchParams.set(
        "id",
        PRODUCT_ID
      );


      /*
       * Sessão.
       */
      url.searchParams.set(
        "sid",
        sid
      );


      /*
       * Tenant.
       */
      url.searchParams.set(
        "tenantId",
        TENANT_ID
      );


      /*
       * Idioma.
       */
      url.searchParams.set(
        "lang",
        LANG
      );


      /*
       * Dispositivo.
       */
      url.searchParams.set(
        "device",
        DEVICE
      );


      /*
       * Obrigatório/recomendado para implementação
       * pela API.
       */
      url.searchParams.set(
        "watchOpeningEvents",
        "true"
      );


      /*
       * NÃO colocamos mais:
       *
       * backdropWidth
       * backdropHeight
       *
       * O próprio tamanho real do iframe
       * deve determinar o viewport.
       */


      return url.toString();
    }


    /*
     * =====================================================
     * ERRO
     * =====================================================
     */

    function showError(
      error
    ) {

      console.error(
        "Erro Sizebay:",
        error
      );


      loading.style.display =
        "none";


      modalArea.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorDetail.textContent =
        error.stack ||
        error.message ||
        String(error);
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    async function start() {

      try {

        /*
         * 1.
         * Obtém SID
         */
        const sid =
          await getSizebaySessionId();


        /*
         * 2.
         * Gera URL
         */
        const iframeUrl =
          buildIframeUrl(
            sid
          );


        console.log(
          "URL Sizebay:"
        );

        console.log(
          iframeUrl
        );


        /*
         * 3.
         * Define evento ANTES do src
         */
        iframe.onload =
          function () {

            console.log(
              "VFR Sizebay carregado."
            );


            loading.style.display =
              "none";


            modalArea.style.display =
              "flex";
          };


        /*
         * 4.
         * Carrega iframe
         */
        iframe.src =
          iframeUrl;

      }
      catch (
        error
      ) {

        showError(
          error
        );
      }
    }


    /*
     * =====================================================
     * INICIALIZAÇÃO
     * =====================================================
     */

    window.addEventListener(
      "load",
      start
    );

  </script>

</body>
</html>
