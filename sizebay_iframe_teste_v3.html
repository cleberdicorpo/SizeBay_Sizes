<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Teste Sizebay Iframe</title>

  <style>
    :root {
      /*
       * Tamanho real do VFR.
       *
       * Vamos manter o iframe com a mesma largura
       * da área apresentada para a Sizebay.
       */
      --iframe-width: 1127px;
      --iframe-height: 915px;

      /*
       * Área que queremos mostrar na tela.
       */
      --crop-width: 909px;
      --crop-height: 506px;

      /*
       * Deslocamento do iframe.
       *
       * Neste teste NÃO vamos centralizar matematicamente.
       * Vamos começar mostrando a parte esquerda do VFR,
       * porque queremos preservar a região onde deveria
       * aparecer a roupa.
       */
      --shift-x: 0px;
      --shift-y: 0px;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    /*
     * Loading
     */
    #loading {
      position: fixed;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      color: #fff;

      font-size: 18px;

      z-index: 100;
    }

    /*
     * Área externa.
     */
    #modal-area {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: #111;

      overflow: hidden;
    }

    /*
     * Janela visível.
     */
    #iframe-crop {
      position: relative;

      width: var(--crop-width);
      height: var(--crop-height);

      overflow: hidden;

      background: #fff;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    /*
     * Iframe Sizebay.
     */
    #szb-modal {
      position: absolute;

      left: var(--shift-x);
      top: var(--shift-y);

      width: var(--iframe-width);
      height: var(--iframe-height);

      border: 0;

      background: #fff;

      display: block;
    }

    /*
     * Tela de erro.
     */
    #error {
      display: none;

      position: fixed;

      inset: 0;

      padding: 32px;

      box-sizing: border-box;

      background: #fff;

      color: #111;

      z-index: 200;
    }

    #error pre {
      padding: 16px;

      background: #111;
      color: #0f0;

      white-space: pre-wrap;

      overflow: auto;

      max-height: 70vh;
    }

    /*
     * Barra de diagnóstico.
     *
     * Depois podemos remover.
     */
    #debug {
      position: fixed;

      left: 10px;
      bottom: 10px;

      padding: 8px 12px;

      background: rgba(0, 0, 0, 0.75);

      color: #fff;

      font-size: 12px;

      z-index: 300;

      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div id="loading">
    Carregando Sizebay...
  </div>


  <div id="modal-area">

    <div id="iframe-crop">

      <iframe
        id="szb-modal"
        class="vfr-app szb-modal-desktop szb-modal-open modal-loaded"
        sizebay-product-reference="118678521"
        allow="clipboard-write; fullscreen"
      ></iframe>

    </div>

  </div>


  <div id="error">

    <h1>
      Erro ao carregar Sizebay
    </h1>

    <pre id="error-detail"></pre>

  </div>


  <div id="debug">
    Sizebay DESKTOP 1127 × 915
  </div>


  <script>

    /*
     * =====================================================
     * CONFIGURAÇÃO
     * =====================================================
     */

    const TENANT_ID =
      "8361";

    const PRODUCT_ID =
      "118678521";

    /*
     * A documentação atual da Sizebay utiliza
     * códigos como br, en, es etc.
     */
    const LANG =
      "br";

    /*
     * Forçamos desktop.
     */
    const DEVICE =
      "DESKTOP";

    /*
     * Mantemos os valores coerentes com o tamanho
     * real do iframe.
     */
    const BACKDROP_WIDTH =
      "1127";

    const BACKDROP_HEIGHT =
      "915";


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const loading =
      document.getElementById(
        "loading"
      );

    const modalArea =
      document.getElementById(
        "modal-area"
      );

    const iframe =
      document.getElementById(
        "szb-modal"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const errorDetail =
      document.getElementById(
        "error-detail"
      );


    /*
     * =====================================================
     * COOKIE
     * =====================================================
     */

    function getCookie(name) {

      const cookies =
        document.cookie
          .split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );

      if (!cookie) {
        return null;
      }

      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value
    ) {

      document.cookie =
        `${name}=${encodeURIComponent(value)}; ` +
        `path=/; ` +
        `max-age=31536000; ` +
        `SameSite=Lax`;
    }


    /*
     * =====================================================
     * SESSION ID
     * =====================================================
     */

    async function getSizebaySessionId() {

      const cookieName =
        "SIZEBAY_SESSION_ID_V4";

      const existingSid =
        getCookie(
          cookieName
        );

      if (existingSid) {

        console.log(
          "SID recuperado:",
          existingSid
        );

        return existingSid;
      }


      const response =
        await fetch(
          "https://vfr-v3-production.sizebay.technology/api/me/session-id"
        );


      if (!response.ok) {

        throw new Error(
          `Erro ao gerar SID. HTTP ${response.status}`
        );
      }


      const raw =
        await response.text();


      const sid =
        raw
          .replaceAll(
            '"',
            ""
          )
          .trim();


      if (!sid) {

        throw new Error(
          "Sizebay retornou SID vazio."
        );
      }


      setCookie(
        cookieName,
        sid
      );


      return sid;
    }


    /*
     * =====================================================
     * URL DO VFR
     * =====================================================
     */

    function buildIframeUrl(
      sid
    ) {

      const url =
        new URL(
          "https://vfr-v3-production.sizebay.technology/V4/"
        );


      url.searchParams.set(
        "mode",
        "vfr"
      );


      url.searchParams.set(
        "id",
        PRODUCT_ID
      );


      url.searchParams.set(
        "sid",
        sid
      );


      url.searchParams.set(
        "tenantId",
        TENANT_ID
      );


      url.searchParams.set(
        "lang",
        LANG
      );


      /*
       * Parâmetro importante:
       * informa explicitamente que é desktop.
       */
      url.searchParams.set(
        "device",
        DEVICE
      );


      /*
       * Recomendado pela própria documentação
       * para integração via iframe/API.
       */
      url.searchParams.set(
        "watchOpeningEvents",
        "true"
      );


      /*
       * Mantemos por enquanto porque você já
       * estava utilizando estes parâmetros.
       */
      url.searchParams.set(
        "backdropWidth",
        BACKDROP_WIDTH
      );


      url.searchParams.set(
        "backdropHeight",
        BACKDROP_HEIGHT
      );


      url.searchParams.set(
        "isMeasurementsTableEnabled",
        "true"
      );


      return url.toString();
    }


    /*
     * =====================================================
     * ERRO
     * =====================================================
     */

    function showError(
      error
    ) {

      console.error(
        error
      );


      loading.style.display =
        "none";


      modalArea.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorDetail.textContent =
        error.stack ||
        error.message ||
        String(error);
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    async function start() {

      try {

        const sid =
          await getSizebaySessionId();


        const iframeUrl =
          buildIframeUrl(
            sid
          );


        console.log(
          "URL Sizebay:"
        );

        console.log(
          iframeUrl
        );


        iframe.onload =
          function () {

            console.log(
              "Sizebay carregada."
            );


            loading.style.display =
              "none";


            modalArea.style.display =
              "flex";
          };


        iframe.src =
          iframeUrl;

      }
      catch (
        error
      ) {

        showError(
          error
        );
      }
    }


    window.addEventListener(
      "load",
      start
    );

  </script>

</body>
</html>
