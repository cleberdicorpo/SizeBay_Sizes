<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sizebay VFR</title>

  <style>
    :root {
      /*
       * Mantemos o iframe claramente em formato landscape.
       */
      --vfr-width: 909px;
      --vfr-height: 500px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /*
     * =====================================================
     * LOADING
     * =====================================================
     */

    #loading {
      position: fixed;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;

      color: #fff;

      font-size: 18px;

      z-index: 100;
    }

    /*
     * =====================================================
     * MODAL
     * =====================================================
     */

    #modal-area {
      display: none;

      width: 100%;
      height: 100vh;

      align-items: center;
      justify-content: center;

      background: #111;
    }

    /*
     * =====================================================
     * CONTAINER
     * =====================================================
     */

    #vfr-container {
      position: relative;

      width: var(--vfr-width);
      height: var(--vfr-height);

      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);

      background: #fff;

      overflow: hidden;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    /*
     * =====================================================
     * IFRAME
     * =====================================================
     */

    #szb-modal {
      display: block;

      width: 909px;
      height: 500px;

      min-width: 909px;
      min-height: 500px;

      border: 0;

      background: #fff;
    }

    /*
     * =====================================================
     * ERRO
     * =====================================================
     */

    #error {
      display: none;

      position: fixed;

      inset: 0;

      padding: 32px;

      background: #fff;

      color: #111;

      z-index: 200;
    }

    #error pre {
      padding: 16px;

      background: #111;
      color: #0f0;

      white-space: pre-wrap;

      overflow: auto;

      max-height: 70vh;
    }
  </style>
</head>

<body>

  <div id="loading">
    Carregando Sizebay...
  </div>


  <div id="modal-area">

    <div id="vfr-container">

      <iframe
        id="szb-modal"
        title="Provador Virtual Sizebay"
        allow="clipboard-write; fullscreen"
      ></iframe>

    </div>

  </div>


  <div id="error">

    <h1>
      Erro ao carregar Sizebay
    </h1>

    <pre id="error-detail"></pre>

  </div>


  <script>

    /*
     * =====================================================
     * CONFIGURAÇÃO
     * =====================================================
     */

    const TENANT_ID =
      "8361";

    const PRODUCT_ID =
      "118678521";

    const LANG =
      "br";


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const loading =
      document.getElementById(
        "loading"
      );

    const modalArea =
      document.getElementById(
        "modal-area"
      );

    const iframe =
      document.getElementById(
        "szb-modal"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const errorDetail =
      document.getElementById(
        "error-detail"
      );


    /*
     * =====================================================
     * COOKIE
     * =====================================================
     */

    function getCookie(name) {

      const cookies =
        document.cookie.split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );

      if (!cookie) {
        return null;
      }

      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value
    ) {

      document.cookie =
        `${name}=${encodeURIComponent(value)}; ` +
        `path=/; ` +
        `max-age=31536000; ` +
        `SameSite=Lax`;
    }


    /*
     * =====================================================
     * SESSION ID
     * =====================================================
     */

    async function getSizebaySessionId() {

      const cookieName =
        "SIZEBAY_SESSION_ID_V4";


      const existingSid =
        getCookie(
          cookieName
        );


      if (existingSid) {

        console.log(
          "SID recuperado:",
          existingSid
        );

        return existingSid;
      }


      const response =
        await fetch(
          "https://vfr-v3-production.sizebay.technology/api/me/session-id"
        );


      if (!response.ok) {

        throw new Error(
          `Erro ao gerar SID. HTTP ${response.status}`
        );
      }


      const raw =
        await response.text();


      const sid =
        raw
          .replaceAll('"', "")
          .trim();


      if (!sid) {

        throw new Error(
          "A Sizebay retornou SID vazio."
        );
      }


      setCookie(
        cookieName,
        sid
      );


      return sid;
    }


    /*
     * =====================================================
     * URL
     * =====================================================
     */

    function buildIframeUrl(
      sid
    ) {

      const url =
        new URL(
          "https://vfr-v3-production.sizebay.technology/V4/"
        );


      url.searchParams.set(
        "mode",
        "vfr"
      );


      url.searchParams.set(
        "id",
        PRODUCT_ID
      );


      url.searchParams.set(
        "sid",
        sid
      );


      url.searchParams.set(
        "tenantId",
        TENANT_ID
      );


      url.searchParams.set(
        "lang",
        LANG
      );


      /*
       * IMPORTANTE:
       *
       * Neste teste NÃO vamos enviar:
       *
       * device
       * backdropWidth
       * backdropHeight
       * watchOpeningEvents
       *
       * Vamos deixar a Sizebay inferir o layout
       * diretamente pelo tamanho real do iframe.
       */


      return url.toString();
    }


    /*
     * =====================================================
     * ERRO
     * =====================================================
     */

    function showError(
      error
    ) {

      console.error(
        error
      );


      loading.style.display =
        "none";


      modalArea.style.display =
        "none";


      errorBox.style.display =
        "block";


      errorDetail.textContent =
        error.stack ||
        error.message ||
        String(error);
    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    async function start() {

      try {

        /*
         * Antes de carregar a Sizebay,
         * garantimos explicitamente o tamanho.
         */
        iframe.style.width =
          "909px";

        iframe.style.height =
          "500px";

        iframe.width =
          "909";

        iframe.height =
          "500";


        const sid =
          await getSizebaySessionId();


        const iframeUrl =
          buildIframeUrl(
            sid
          );


        console.log(
          "URL Sizebay:",
          iframeUrl
        );


        console.log(
          "Viewport pai:",
          window.innerWidth,
          "x",
          window.innerHeight
        );


        console.log(
          "Iframe configurado:",
          iframe.width,
          "x",
          iframe.height
        );


        iframe.onload =
          function () {

            console.log(
              "Sizebay carregada."
            );


            console.log(
              "Iframe renderizado:",
              iframe.getBoundingClientRect().width,
              "x",
              iframe.getBoundingClientRect().height
            );


            loading.style.display =
              "none";


            modalArea.style.display =
              "flex";
          };


        iframe.src =
          iframeUrl;

      }
      catch (
        error
      ) {

        showError(
          error
        );
      }
    }


    window.addEventListener(
      "load",
      start
    );

  </script>

</body>
</html>
